[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fast_o3_iv"
version = "0.0.1"
description = "Fast surrogate modeling for O3 internal variability"
authors = ["Emmie Le Roy"]
license = "MIT"
readme = "README.md"
packages = [{ include = "fast_o3_iv", from = "src" }]

[tool.poetry.dependencies]
python = "~3.11.0"
ipython = "*"
jupyterlab = "*"
matplotlib = "*"
mkdocs = "*"
notebook = "*"
pytest = "*"
python-dotenv = "*"
ruff = "*"
tqdm = "*"
typer = "*"
pandas = "<3.0.0"
xarray = "^2026.1.0"
netCDF4 = "^1.7.4"
ipykernel = "^7.2.0"
"geocat.comp" = "^2026.1.0"
dask = "^2026.1.2"
pytest-forked = "^1.6.0"
xesmf = "^0.9.2"
numpy = ">=2.3,<2.4"
numba = ">=0.61"
sparse = "*"
nc-time-axis = "^1.4.1"
ipywidgets = "^8.1.8"
jupyterlab-widgets = "^3.0.16"
joblib = "^1.5.3"
scikit-learn = "^1.8.0"
Cartopy = "^0.25.0"
pyarrow = "^23.0.0"
mlflow = "^3.10.0"
rioxarray = "0.19.0"
cmcrameri = "^1.9"
regionmask = "^0.13.0"

[tool.ruff]
line-length = 99
src = ["fast_o3_iv"]
include = ["pyproject.toml", "fast_o3_iv/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["fast_o3_iv"]
force-sort-within-sections = true
