[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fast_o3_iv"
version = "0.0.1"
description = "Fast surrogate modeling of ozone internal variability"
authors = [
  { name = "Emmie Le Roy" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
    "geocat-comp (>=2026.1.0,<2027.0.0)",
    "xarray (==2026.1.0)",
    "netcdf4 (>=1.7.4,<2.0.0)",
    "h5py (>=3.15.1,<4.0.0)",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["fast_o3_iv"]
include = ["pyproject.toml", "fast_o3_iv/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["fast_o3_iv"]
force-sort-within-sections = true

