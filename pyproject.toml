[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fast_o3_iv"
version = "0.0.1"
description = "Fast surrogate modeling for O3 internal variability"
authors = ["Emmie Le Roy"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.11.0"
ipython = "*"
jupyterlab = "*"
loguru = "*"
matplotlib = "*"
mkdocs = "*"
notebook = "*"
pytest = "*"
python-dotenv = "*"
ruff = "*"
tqdm = "*"
typer = "*"
pandas = "^3.0.0"
xarray = "^2026.1.0"
netCDF4 = "^1.7.4"
h5py = "^3.15.1"
ipykernel = "^7.2.0"
pip = "^26.0.1"
"geocat.comp" = "^2026.1.0"
dask = "^2026.1.2"
h5netcdf = "^1.8.1"
pytest-forked = "^1.6.0"
xesmf = "^0.9.2"
numpy = ">=2.3,<2.4"
numba = ">=0.61"
sparse = "*"

[tool.ruff]
line-length = 99
src = ["fast_o3_iv"]
include = ["pyproject.toml", "fast_o3_iv/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["fast_o3_iv"]
force-sort-within-sections = true